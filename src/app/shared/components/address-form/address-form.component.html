<form class="address-form" autocomplete="off" (ngSubmit)="submitAddress()">
  <label for="delivery-mobile-number">Mobile number</label>
  <input
    id="delivery-mobile-number"
    type="tel"
    inputmode="numeric"
    autocomplete="new-password"
    maxlength="10"
    placeholder="Enter 10-digit number"
    [(ngModel)]="address.mobileNumber"
    name="mobileNumber"
    required
    pattern="[0-9]{10}"
    [disabled]="lookupLoading || saveLoading"
    (blur)="lookupAddress()"
    (keydown.enter)="lookupAddress(); $event.preventDefault()" />
  @if (addressMessage) {
    <small class="address-status" role="status">{{ addressMessage }}</small>
  }

  <label for="delivery-address">Address</label>
  <textarea
    id="delivery-address"
    autocomplete="new-password"
    rows="3"
    [(ngModel)]="address.address"
    name="address"
    required
    [disabled]="lookupLoading || saveLoading"></textarea>

  <div class="address-row">
    <label>City<input autocomplete="new-password" [(ngModel)]="address.city" name="city" required [disabled]="lookupLoading || saveLoading" /></label>
    <label>State<input autocomplete="new-password" [(ngModel)]="address.state" name="state" required [disabled]="lookupLoading || saveLoading" /></label>
  </div>

  <label for="delivery-postal">PIN code</label>
  <input
    id="delivery-postal"
    autocomplete="new-password"
    [(ngModel)]="address.postalCode"
    name="postalCode"
    required
    [disabled]="lookupLoading || saveLoading" />

  <button mat-flat-button class="address-submit" type="submit" [disabled]="loading || saveLoading || lookupLoading">
    @if (loading || saveLoading) {
      <span>CREATING ORDER & OPENING PAYMENT...</span>
    } @else {
      <span>CONFIRM PAYMENT</span>
    }
  </button>
</form>
