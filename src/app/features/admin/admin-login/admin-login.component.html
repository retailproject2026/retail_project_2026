<main class="admin-login-page">
  <section class="admin-login-panel" aria-labelledby="admin-login-title">
    <span class="admin-login-kicker">PRIVATE AREA</span>
    <h1 id="admin-login-title">Admin sign in</h1>
    <p>Sign in with your admin credentials to manage products, orders, and customers.</p>

    <form (ngSubmit)="submit()" autocomplete="off">
      <label for="admin-email">Admin Email</label>
      <input
        id="admin-email"
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="admin@example.com"
        autocomplete="email"
        required
        autofocus />

      <label for="admin-password">Password</label>
      <input
        id="admin-password"
        name="password"
        type="password"
        [(ngModel)]="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required />

      @if (errorMessage) {
        <p class="admin-login-error" role="alert">{{ errorMessage }}</p>
      }

      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="submitting || !email.trim() || !password">
        {{ submitting ? 'SIGNING IN...' : 'SIGN IN' }}
      </button>
    </form>

    <a routerLink="/" class="back-link">Return to store</a>
  </section>
</main>
